name: "Setup HIP (Windows)"
description: "Downloads, caches, and configures the AMD ROCm TheRock SDK for Windows"
inputs:
  hip-version:
    description: "ROCm TheRock SDK version (e.g., 7.14.0)"
    required: true
  cache:
    description: Whether to enable cache
    required: false
    default: "false"
  cache-key:
    description: "Extra cache key part"
    required: false
    default: "default"

runs:
  using: "composite"
  steps:
    # - name: Restore ROCm TheRock SDK
    #   id: cache-hip
    #   if: inputs.cache != 'false'
    #   uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
    #   with:
    #     path: C:\TheRock\build
    #     key: setup-hip-windows-${{ runner.os }}-${{ inputs.hip-version }}-${{ inputs.cache-key }}

    - name: Download TheRock SDK
      if: steps.cache-hip.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $archive = "therock-dist-windows-multiarch-${{ inputs.hip-version }}.tar.gz"
        $archivePath = Join-Path $env:RUNNER_TEMP $archive
        curl.exe --fail --location --retry 3 --output $archivePath "https://repo.amd.com/rocm/tarball-multi-arch/$archive"

    - name: Extract TheRock SDK
      if: steps.cache-hip.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $archive = "therock-dist-windows-multiarch-${{ inputs.hip-version }}.tar.gz"
        $archivePath = Join-Path $env:RUNNER_TEMP $archive
        New-Item -ItemType Directory -Path 'C:\TheRock\build' -Force | Out-Null
        tar.exe -xzf $archivePath -C 'C:\TheRock\build' --strip-components=1

    # - name: Save ROCm TheRock SDK
    #   if: inputs.cache != 'false' && steps.cache-hip.outputs.cache-hit != 'true'
    #   uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
    #   with:
    #     path: C:\TheRock\build
    #     key: setup-hip-windows-${{ runner.os }}-${{ inputs.hip-version }}-${{ inputs.cache-key }}

    - name: Configure HIP Path
      shell: pwsh
      run: |
        $rocmRoot = 'C:/TheRock/build'
        $llvmRoot = "$rocmRoot/lib/llvm"

        "CC=$llvmRoot/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CXX=$llvmRoot/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
        "ROCM_PATH=$rocmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HIP_PATH=$rocmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HIP_DIR=$rocmRoot/lib/cmake/hip" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HIP_DEVICE_LIB_PATH=$llvmRoot/amdgcn/bitcode" | Out-File -FilePath $env:GITHUB_ENV -Append
        "HIP_PLATFORM=amd" | Out-File -FilePath $env:GITHUB_ENV -Append
        "LLVM_PATH=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CMAKE_PREFIX_PATH=$rocmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$rocmRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        "$llvmRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
