name: MLRT-ORT

on:
  push:
    branches:
      - master
    paths:
      - vsmlrt/ort/**
      - .github/workflows/pkg-ort.yml
      - .github/actions/setup-cuda-*/**
      - .github/actions/setup-cudnn-*/**
      - .github/actions/setup-onnx-*/**
      - .github/actions/setup-onnxruntime-*/**
      - .github/cmake-cache/onnx-*/**
      - .github/cmake-cache/onnxruntime-*/**
  pull_request:
    paths:
      - vsmlrt/ort/**
      - .github/workflows/pkg-ort.yml
      - .github/actions/setup-cuda-*/**
      - .github/actions/setup-cudnn-*/**
      - .github/actions/setup-onnx-*/**
      - .github/actions/setup-onnxruntime-*/**
      - .github/cmake-cache/onnx-*/**
      - .github/cmake-cache/onnxruntime-*/**
  schedule:
    - cron: 39 4 2-30/4 * *
  workflow_dispatch:
    inputs:
      publish:
        description: Publish built distributions
        type: boolean
        required: false
        default: false
      repository:
        description: Package index to publish to
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi
      version:
        description: Version override (SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT)
        type: string
        required: false
      onnxruntime-windows-tag:
        description: ONNX tag for Windows (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.28.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      onnxruntime-linux-tag:
        description: ONNX tag for Linux (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.28.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      onnxruntime-macos-tag:
        description: ONNX tag for macOS (https://github.com/microsoft/onnxruntime)
        type: string
        required: false
        default: "v1.28.0" # renovate: datasource=github-tags depName=microsoft/onnxruntime
      cuda-windows:
        description: CUDA version for Windows (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
        default: "13.3.1"
      cuda-linux:
        description: CUDA version for Linux (https://developer.nvidia.com/cuda-toolkit-archive)
        type: string
        required: false
        default: "13.3"
      cudnn-windows:
        description: cuDNN version for Windows (https://developer.nvidia.com/cudnn-downloads, https://developer.nvidia.com/cudnn-archive)
        type: string
        required: false
        default: "9.25.0.15" # renovate: datasource=pypi depName=nvidia-cudnn-cu13
      cudnn-linux:
        description: cuDNN version for Linux (https://developer.nvidia.com/cudnn-downloads, https://developer.nvidia.com/cudnn-archive)
        type: string
        required: false
        default: "9.25.0.15" # renovate: datasource=pypi depName=nvidia-cudnn-cu13

env:
  ONNXRUNTIME_WINDOWS_TAG: ${{ inputs.onnxruntime-windows-tag || 'v1.28.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  ONNXRUNTIME_LINUX_TAG: ${{ inputs.onnxruntime-linux-tag || 'v1.28.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  ONNXRUNTIME_MACOS_TAG: ${{ inputs.onnxruntime-macos-tag || 'v1.28.0' }} # renovate: datasource=github-tags depName=microsoft/onnxruntime
  CUDA_WINDOWS_VERSION: ${{ inputs.cuda-windows || '13.3.1' }}
  CUDA_LINUX_VERSION: ${{ inputs.cuda-linux || '13.3' }}
  CUDNN_WINDOWS_VERSION: ${{ inputs.cudnn-windows || '9.25.0.15' }} # renovate: datasource=pypi depName=nvidia-cudnn-cu13
  CUDNN_LINUX_VERSION: ${{ inputs.cudnn-linux || '9.25.0.15' }} # renovate: datasource=pypi depName=nvidia-cudnn-cu13
  PACKAGE_NAME: ort

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            cuda_repo: rhel8/x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cuda_repo: rhel8/sbsa
          - name: Windows x64
            os: windows-2025-vs2026
          - name: macOS ARM64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel

    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive vsmlrt/${{ env.PACKAGE_NAME }}/vs-mlrt vsmlrt/${{ env.PACKAGE_NAME }}/vapoursynth

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          uv tool install cmake
          uv tool install ninja
          uv tool install auditwheel
          uv tool install patchelf
          uv tool install wheel

      - name: Build ONNX Runtime dependency (Windows)
        if: runner.os == 'Windows'
        id: setup-onnxruntime-windows
        uses: ./.github/actions/setup-onnxruntime-windows
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_WINDOWS_TAG }}
          build-cuda: true
          cuda-version: ${{ env.CUDA_WINDOWS_VERSION }}
          cudnn-version: ${{ env.CUDNN_WINDOWS_VERSION }}
          os: ${{ matrix.container || matrix.os }}

      - name: Build ONNX Runtime dependency (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-onnxruntime-linux
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_LINUX_TAG }}
          build-cuda: true
          cuda-version: ${{ env.CUDA_LINUX_VERSION }}
          cuda-repo: ${{ matrix.cuda_repo }}
          cudnn-version: ${{ env.CUDNN_LINUX_VERSION }}
          os: ${{ matrix.container || matrix.os }}

      - name: Build ONNX Runtime dependency (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-onnxruntime-macos
        with:
          onnxruntime-tag: ${{ env.ONNXRUNTIME_MACOS_TAG }}
          os: ${{ matrix.os }}

      - name: Get ONNX version from ONNX Runtime
        id: get-onnx-version
        shell: bash
        run: |
          git -C onnxruntime/cmake/external/onnx/ fetch --tags --depth=1 2>/dev/null || true
          version=$(git -C onnxruntime/cmake/external/onnx/ describe --exact-match --tags 2>/dev/null || git -C onnxruntime/cmake/external/onnx/ rev-parse HEAD)
          echo "version=$version" | tee -a $GITHUB_OUTPUT

      - name: Build ONNX dependency (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-onnx-windows
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.container || matrix.os }}
          msvc-runtime: MultiThreadedDLL

      - name: Build ONNX dependency (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-onnx-linux
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.container || matrix.os }}

      - name: Build ONNX dependency (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-onnx-macos
        with:
          onnx-tag: ${{ steps.get-onnx-version.outputs.version }}
          os: ${{ matrix.container || matrix.os }}

      - name: Build wheel
        run: uv build --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }}
        env:
          DML_DIR: ${{ steps.setup-onnxruntime-windows.outputs.dml-path }}
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT: ${{ inputs.version }}

      - name: Build CUDA provider wheel
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: uv build --wheel --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }}-cuda
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT_CUDA: ${{ inputs.version }}

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair \
            --exclude libonnxruntime.so* \
            --exclude libonnxruntime_providers_cuda.so* \
            --exclude libonnxruntime_providers_shared.so* \
            --exclude libcudnn.so* \
            --exclude libcudnn_*.so* \
            --exclude libcublas.so* \
            --exclude libcublasLt.so* \
            --exclude libcudart.so* \
            --exclude libcufft.so* \
            --exclude libcurand.so* \
            --exclude libnvrtc.so* \
            --exclude libcuda.so* \
            --strip dist/*.whl \
            -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/

          # Fix RPATH for all bundled libraries in the repaired wheel to ensure they find each other via $ORIGIN
          echo "=== Patching RPATHs inside repaired wheel ==="
          wheel unpack dist/*.whl
          UNPACKED_DIR=$(ls -d vapoursynth_mlrt_ort-*)
          for f in "$UNPACKED_DIR"/vapoursynth/plugins/ort/*.so*; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then
              echo "Setting RPATH on: $(basename "$f")"
              patchelf --set-rpath '$ORIGIN:$ORIGIN/../../../nvidia/cu13/lib:$ORIGIN/../../../nvidia/cudnn/lib' "$f"
            fi
          done
          echo "Repacking wheel..."
          rm dist/*.whl
          wheel pack "$UNPACKED_DIR" -d dist/
          rm -rf "$UNPACKED_DIR"

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          uvx --from delocate delocate-wheel -v dist/*.whl -w repaired_wheels
          rm dist/*.whl
          mv repaired_wheels/*.whl dist/
          uvx --from delocate delocate-listdeps dist/*.whl

      - name: Split CUDA provider
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: uv run --with wheel --python 3.12 --no-sync --no-project python {0}
        run: |
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))

          with tempfile.TemporaryDirectory() as temp_dir:
              subprocess.run(
                  [sys.executable, "-m", "wheel", "unpack", str(wheel), "-d", temp_dir],
                  check=True,
              )

              unpacked_dir = next(Path(temp_dir).iterdir())
              provider = unpacked_dir / (
                  "vapoursynth/plugins/ort/vsort/onnxruntime_providers_cuda.dll"
                  if sys.platform == "win32"
                  else "vapoursynth/plugins/ort/libonnxruntime_providers_cuda.so"
              )
              provider_dir = Path("vsmlrt/ort/cuda/provider")
              provider_dir.mkdir()
              shutil.move(provider, provider_dir)

              wheel.unlink()
              subprocess.run(
                  [sys.executable, "-m", "wheel", "pack", str(unpacked_dir), "-d", "dist"],
                  check=True,
              )

      - name: Build CUDA provider wheel
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: uv build --wheel --out-dir cuda_dist vsmlrt/ort/cuda
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT_CUDA: ${{ inputs.version }}
          SKBUILD_WHEEL_TAGS: py3-none-${{ matrix.cuda_tag }}

      - name: Re-compress wheel with DEFLATED (level 9)
        shell: uv run --python 3.12 --no-sync --no-project python {0}
        run: |
          import zipfile
          from pathlib import Path

          for dist_dir in (Path("dist"), Path("cuda_dist")):
              for whl_path in dist_dir.glob("*.whl"):
                  print(f"Re-compressing {whl_path} with DEFLATED (level 9)...")
                  temp_whl = whl_path.with_suffix(".whl.tmp")

                  with (
                      zipfile.ZipFile(whl_path, "r") as z_in,
                      zipfile.ZipFile(temp_whl, "w") as z_out,
                  ):
                      for info in z_in.infolist():
                          data = z_in.read(info.filename)
                          new_info = zipfile.ZipInfo(info.filename)
                          new_info.date_time = info.date_time
                          new_info.external_attr = info.external_attr

                          z_out.writestr(new_info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

                  temp_whl.replace(whl_path)
                  print(f"Done! New size: {whl_path.stat().st_size / (1024 * 1024):.2f} MB")

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-generic-wheels-${{ matrix.name }}
          path: ./dist/*.whl

      - name: Upload CUDA provider wheel
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-cuda-wheels-${{ matrix.name }}
          path: ./cuda_dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: >-
          git submodule update --init --recursive
          vsmlrt/${{ env.PACKAGE_NAME }}/vs-mlrt
          vsmlrt/${{ env.PACKAGE_NAME }}/vapoursynth

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist --package vapoursynth-mlrt-${{ env.PACKAGE_NAME }}
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VAPOURSYNTH_MLRT_ORT: ${{ inputs.version }}

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-generic-sdist
          path: dist/*.tar.gz

      - name: Generate metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.repository == 'pypi'
        run: |
          VERSION=$(uvx pkginfo dist/*.tar.gz | grep "^version:" | cut -d' ' -f2)
          cat << EOF > metadata.json
          {
            "package": "vapoursynth-mlrt-${{ env.PACKAGE_NAME }}",
            "version": "$VERSION",
            "onnxruntime_windows": "${{ env.ONNXRUNTIME_WINDOWS_TAG }}",
            "onnxruntime_linux": "${{ env.ONNXRUNTIME_LINUX_TAG }}",
            "onnxruntime_macos": "${{ env.ONNXRUNTIME_MACOS_TAG }}",
            "cuda_windows": "${{ env.CUDA_WINDOWS_VERSION }}",
            "cuda_linux": "${{ env.CUDA_LINUX_VERSION }}",
            "cudnn_windows": "${{ env.CUDNN_WINDOWS_VERSION }}",
            "cudnn_linux": "${{ env.CUDNN_LINUX_VERSION }}"
          }
          EOF

      - name: Upload metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.repository == 'pypi'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PACKAGE_NAME }}-metadata
          path: metadata.json

  trigger-publish:
    name: Trigger ${{ inputs.repository }} publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        run: >-
          gh workflow run cd-publish.yml
          -f artifact-pattern=${{ env.PACKAGE_NAME }}-generic-*
          -f package=vapoursynth-mlrt-${{ env.PACKAGE_NAME }}
          -f packages-dir=dist
          -f repository=${{ inputs.repository }}
          -f repository-url="$REPOSITORY_URL"
          -f run-id=${{ github.run_id }}
          --ref ${{ github.ref_name }}

      - name: Trigger CUDA provider publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        run: >-
          gh workflow run cd-publish.yml
          -f artifact-pattern=${{ env.PACKAGE_NAME }}-cuda-*
          -f package=vapoursynth-mlrt-${{ env.PACKAGE_NAME }}-cuda
          -f packages-dir=dist
          -f repository=${{ inputs.repository }}
          -f repository-url="$REPOSITORY_URL"
          -f run-id=${{ github.run_id }}
          --ref ${{ github.ref_name }}
