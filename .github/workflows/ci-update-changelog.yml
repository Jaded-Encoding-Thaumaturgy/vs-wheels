name: Update Changelog

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  update:
    name: Update Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Update Changelog and Generate Markdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --script scripts/generate_changelog.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update changelog"
          title: "Auto-update changelog"
          body: "This is an automated PR to update the CHANGELOG.md and changelog.json files."
          branch: "update-changelog"
          delete-branch: true
          add-paths: |
            CHANGELOG.md
            changelog.json
