name: Upload to HuggingFace Bucket

on:
  workflow_call:
    inputs:
      wheel-pattern:
        description: Pattern for wheel artifacts
        type: string
        required: true
      sdist-name:
        description: Name for sdist artifact
        type: string
        required: true

jobs:
  upload-bucket:
    name: Upload to HF Bucket
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.wheel-pattern }}
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.sdist-name }}
          path: dist

      - name: Generate PEP 658 metadata
        run: uv run scripts/generate_metadata.py

      - name: Sync to Hugging Face Bucket
        env:
          HF_OIDC_RESOURCE: buckets/Ichunjo/wheel-storage
          HF_DEBUG: 1
        run: uvx hf sync dist hf://buckets/Ichunjo/wheel-storage
