[build-system]
requires = ["scikit-build-core>=1.0.3", "setuptools-scm>=10.2.1"]
build-backend = "scikit_build_core.build"

[project]
name = "vapoursynth-mlrt-ort"
dynamic = ["version", "readme", "optional-dependencies"]
description = "ONNX Runtime-based CPU/GPU inference plugin for VapourSynth"
license = "GPL-3.0-or-later"
license-files = ["vs-mlrt/LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "AmusementClub" }]
maintainers = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]
dependencies = ["vapoursynth>=75"]

[project.urls]
"Source Code" = "https://github.com/AmusementClub/vs-mlrt"
"Bug Tracker" = "https://github.com/AmusementClub/vs-mlrt/issues"
"Repository" = "https://github.com/Jaded-Encoding-Thaumaturgy/vs-wheels"

[tool.scikit-build]
metadata.optional-dependencies.provider = "scikit_build_core.metadata.template"
metadata.optional-dependencies.result = { cuda = [
    "vapoursynth-mlrt-ort-cuda=={project[version]}",
] }
wheel.exclude = ["*.lib"]
sdist.exclude = ["/cuda"]
wheel.install-dir = "vapoursynth/plugins/ort"
wheel.expand-macos-universal-tags = true
wheel.py-api = "py3"
cmake.source-dir = "."
cmake.args = ["-G", "Ninja"]
cmake.define.CMAKE_BUILD_TYPE = "MinSizeRel"
ninja.make-fallback = false
ninja.version = ">=1.5"

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreadedDLL"
cmake.define.ENABLE_DML = "ON"
cmake.define.ENABLE_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
if.platform-machine = "x86_64"
inherit.cmake.define = "append"
cmake.define.CMAKE_CXX_FLAGS = "-Wall -ffast-math -march=x86-64-v3"
cmake.define.ENABLE_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
if.platform-machine = "aarch64"
inherit.cmake.define = "append"
cmake.define.CMAKE_CXX_FLAGS = "-Wall -ffast-math -march=armv8.2-a"
cmake.define.ENABLE_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
if.platform-machine = "arm64"
inherit.cmake.define = "append"
cmake.define.CMAKE_CXX_FLAGS = "-Wall -ffast-math -mcpu=apple-m1"
cmake.define.ENABLE_COREML = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
if.platform-machine = "x86_64"
inherit.cmake.define = "append"
cmake.define.CMAKE_CXX_FLAGS = "-Wall -ffast-math -march=x86-64-v3"
cmake.define.ENABLE_COREML = "ON"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.fancy_pypi_readme"

[tool.setuptools_scm]
root = "vs-mlrt"
local_scheme = "no-local-version"
tag_regex = '^v(?P<version>\d+(?:\.\d+)*)$'
fallback_version = "0.0.0.dev0"

[tool.setuptools_scm.scm.git]
describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v*",
    "--exclude",
    "*.*[a-z]*",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }, { path = "vs-mlrt/vsort/README.md" }]

[tool.uv.sources]
"vapoursynth-mlrt-ort-cuda" = { workspace = true }
