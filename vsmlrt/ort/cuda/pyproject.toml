[build-system]
requires = [
    "scikit-build-core>=1.0",
    "setuptools-scm",
    "ninja ; sys_platform != 'win32'",
]
build-backend = "scikit_build_core.build"

[project]
name = "vapoursynth-mlrt-ort-cuda"
dynamic = ["version", "dependencies"]
description = "CUDA provider dependency for vapoursynth-mlrt-ort"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "AmusementClub" }]
maintainers = [{ name = "Vardë", email = "ichunjo.le.terrible@gmail.com" }]

[project.optional-dependencies]
cufft = [
    "nvidia-cufft>=12.0.0,<13.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-cufft
]

[project.urls]
"Source Code" = "https://github.com/AmusementClub/vs-mlrt"
"Bug Tracker" = "https://github.com/AmusementClub/vs-mlrt/issues"
"Repository" = "https://github.com/Jaded-Encoding-Thaumaturgy/vs-wheels"

[tool.setuptools_scm]
root = "../vs-mlrt"
local_scheme = "no-local-version"
tag_regex = '^v(?P<version>\d+(?:\.\d+)*)$'
fallback_version = "0.0.0.dev0"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --match v* --exclude *.*[a-z]*"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
metadata.dependencies.provider = "scikit_build_core.metadata.template"
metadata.dependencies.result = [
    "vapoursynth-mlrt-ort=={project[version]}",
    "nvidia-cublas>=13.0.0,<14.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-cublas
    "nvidia-cuda-runtime>=13.0.0,<14.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-cuda-runtime
    "nvidia-cudnn-cu13>=9.0.0,<10.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-cudnn-cu13
    "nvidia-cuda-cupti>=13.0.0,<14.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-cuda-cupti
    "nvidia-curand>=10.0.0,<11.0.0 ; sys_platform == 'win32' or sys_platform == 'linux'", # renovate: datasource=pypi depName=nvidia-curand
]
wheel.install-dir = "vapoursynth/plugins/ort"
wheel.py-api = "py3"
wheel.platlib = true
cmake.source-dir = "."
cmake.args = ["-G", "Ninja"]
ninja.make-fallback = false
ninja.version = ">=1.5"
